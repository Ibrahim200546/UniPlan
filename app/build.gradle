plugins { id 'com.android.application' }

// Demo has no dependency on credentials or Firebase. Apply processing only when
// the user supplies the REAL configuration, never a generated placeholder.
def firebaseConfig = file('src/firebase/google-services.json')
if (firebaseConfig.exists()) {
    apply plugin: 'com.google.gms.google-services'
    tasks.configureEach { task ->
        if (task.name.contains('Demo') && task.name.endsWith('GoogleServices')) task.enabled = false
    }
}

android {
    namespace 'kz.uniplan.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'kz.uniplan.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions { annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] } }
    }
    flavorDimensions += 'auth'
    productFlavors {
        demo {
            dimension 'auth'
            applicationIdSuffix '.demo'
            resValue 'string', 'app_name', 'UniPlan Demo'
        }
        firebase {
            dimension 'auth'
            resValue 'string', 'app_name', 'UniPlan'
        }
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', layout.buildDirectory.dir('robolectric-cache').get().asFile.absolutePath
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    firebaseImplementation platform('com.google.firebase:firebase-bom:34.4.0')
    firebaseImplementation 'com.google.firebase:firebase-auth'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
