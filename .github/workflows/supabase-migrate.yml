name: Supabase Migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uniplan-production-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Link, inspect and apply versioned migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo '::error::Missing SUPABASE_DB_PASSWORD'; exit 1; }
          npx --no-install supabase link --project-ref rrhuqwaytpeerirbnhlc
          npx --no-install supabase migration list --linked
          npx --no-install supabase db push --linked --dry-run
          npx --no-install supabase db push --linked --yes
          npx --no-install supabase migration list --linked
          npx --no-install supabase db advisors --linked --type security --fail-on error
      - name: Allow the Android email callback
        env:
          SUPABASE_PROJECT_REF: rrhuqwaytpeerirbnhlc
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-auth.mjs
      - name: Verify deployed endpoints deny anonymous data access
        run: node scripts/check-cloud-config.mjs
