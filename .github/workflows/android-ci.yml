name: Android CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Test PostgreSQL migration and RLS
        run: npm ci --ignore-scripts && npm test
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify both app variants
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDemoDebugUnitTest :app:testSupabaseDebugUnitTest :app:lintSupabaseDebug :app:assembleSupabaseDebug
      - name: Keep reports and installable test APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ci-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/
            app/build/outputs/apk/supabase/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
