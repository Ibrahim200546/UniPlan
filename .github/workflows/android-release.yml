name: Android APK Release
run-name: UniPlan build ${{ github.run_number }} В· ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uniplan-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || '51b7a4ef033c2dec5ff6daa752e80f34a0dc443742fbf242b1af8259560cebe5' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://rrhuqwaytpeerirbnhlc.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_PLJY8arOylY074jvUZmyMw_2HFvo0RL' }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate required public Supabase configuration
        run: |
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse
          url = os.environ.get('SUPABASE_URL', '')
          key = os.environ.get('SUPABASE_PUBLISHABLE_KEY', '')
          parsed = urlparse(url)
          if (url != url.strip() or parsed.scheme != 'https' or not parsed.hostname
                  or parsed.username or parsed.password or parsed.query or parsed.fragment
                  or parsed.path not in ('', '/')):
              sys.exit('::error::Set repository variable SUPABASE_URL to the HTTPS project URL.')
          if not re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]+', key):
              sys.exit('::error::Set SUPABASE_PUBLISHABLE_KEY to a public sb_publishable_ key. Secret/service_role keys are forbidden.')
          PY

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check database contract and hosted setup
        run: |
          npm ci --ignore-scripts
          npm test
          node scripts/check-cloud-config.mjs

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test and build the real authentication app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -PciBuildNumber="$GITHUB_RUN_NUMBER" \
            -PsupabaseUrl="$SUPABASE_URL" \
            -PsupabasePublishableKey="$SUPABASE_PUBLISHABLE_KEY" \
            :app:validateSupabaseConfig :app:testDemoDebugUnitTest :app:testSupabaseDebugUnitTest :app:lintSupabaseDebug :app:assembleSupabaseDebug

      - name: Restore the existing signing key and verify its certificate
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64. Add the existing UniPlan signing key as a repository secret; a replacement key will not be generated.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uniplan-signing.keystore"
          actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/uniplan-signing.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::Signing certificate does not match the existing UniPlan downloads.'
            exit 1
          fi

      - name: Sign the final APK and verify the release files
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/supabase/debug/app-supabase-debug.apk'
          test -s "$apk"
          mkdir -p dist
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/uniplan-signing.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --out dist/UniPlan.apk "$apk"
          "$signer" verify --verbose --print-certs dist/UniPlan.apk > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print tolower($2)}' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':[:space:]')
          if [[ "$actual" != "$EXPECTED_CERT_SHA256" ]]; then
            cat "$RUNNER_TEMP/apk-signature.txt"
            echo '::error::APK certificate mismatch'
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          with open('app/build/outputs/apk/supabase/debug/output-metadata.json', encoding='utf-8') as stream:
              metadata = json.load(stream)
          assert metadata['applicationId'] == 'kz.uniplan.app', 'Refusing to publish a demo or unexpected package'
          assert len(metadata['elements']) == 1, 'Expected one installable APK'
          assert metadata['elements'][0]['versionCode'] == 1000 + int(os.environ['GITHUB_RUN_NUMBER']), 'CI versionCode was not applied'
          PY
          (cd dist && sha256sum UniPlan.apk > SHA256SUMS)
          python3 scripts/update-manifest.py

      - name: Upload the verified files for the publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uniplan-${{ github.run_id }}
          path: |
            dist/UniPlan.apk
            dist/SHA256SUMS
            dist/update.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Keep unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Remove the temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/uniplan-signing.keystore"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: build-${{ github.run_number }}
    steps:
      - name: Download only this run's verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uniplan-${{ github.run_id }}
          path: dist

      - name: Stage assets, then publish the current main build
        run: |
          set -euo pipefail
          test -s dist/UniPlan.apk
          (cd dist && sha256sum --check SHA256SUMS)
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; this build will not replace Latest.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Drafts may not have a public tag yet. Use their release IDs throughout.
          releases="repos/$GH_REPO/releases"
          gh api --paginate --slurp "$releases" | jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)] | first // null' > release.json
          if jq -e '. != null' release.json > /dev/null; then
            if [[ $(jq -r .draft release.json) != true ]]; then
              echo "Release $RELEASE_TAG is already published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ $(jq -r .target_commitish release.json) == "$GITHUB_SHA" ]] || { echo '::error::Draft targets another commit'; exit 1; }
          else
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json 2> tag-error.txt; then
              [[ $(jq -r .object.type tag.json) == commit && $(jq -r .object.sha tag.json) == "$GITHUB_SHA" ]] || { echo '::error::Tag targets another object'; exit 1; }
            else
              grep -q 'HTTP 404' tag-error.txt || { cat tag-error.txt; exit 1; }
            fi
            gh api -X POST "$releases" -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="UniPlan build $GITHUB_RUN_NUMBER" -F draft=true -f make_latest=false \
              -f body="Signed UniPlan Android APK. Build $GITHUB_RUN_NUMBER from $GITHUB_SHA." > release.json
          fi

          id=$(jq -er '.id' release.json)
          upload_url=$(jq -er '.upload_url | split("{")[0]' release.json)
          [[ "$upload_url" == "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets" ]]
          for name in UniPlan.apk SHA256SUMS update.json; do
            digest="sha256:$(sha256sum "dist/$name" | cut -d ' ' -f 1)"
            asset=$(jq -c --arg n "$name" '.assets[] | select(.name == $n)' release.json)
            if [[ -n "$asset" ]]; then
              [[ $(jq -r .digest <<< "$asset") != "$digest" ]] || continue
              gh api -X DELETE "$releases/assets/$(jq -er .id <<< "$asset")"
            fi
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/octet-stream' --data-binary "@dist/$name" "$upload_url?name=$name" \
              | jq -e --arg digest "$digest" '.state == "uploaded" and .digest == $digest' > /dev/null
          done
          gh api "$releases/$id" | jq -e '.draft and ([.assets[] | select(.state == "uploaded") | .name] | sort == ["SHA256SUMS","UniPlan.apk","update.json"])' > /dev/null
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Main changed during upload. Complete files remain in a draft; Latest was not changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X PATCH "$releases/$id" -F draft=false -f make_latest=true --jq .html_url
          printf '[Download UniPlan.apk](https://github.com/%s/releases/latest/download/UniPlan.apk)\n' "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"
